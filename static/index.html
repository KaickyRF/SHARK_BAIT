<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharkBait - Game Deals Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🦈 SharkBait</h1>
        <p>The best deals for your money</p>
    </header>

    <main class="dashboard-grid">
        <section class="kpis-container">
            <div class="kpis-card">
                <span class="kpis-total">Total Deals</span>
                <h2 id="total-deals-val">0</h2>
            </div>
            <div class="kpis-card">
                <span class="kpis-promo">Best Discount</span>
                <h2 id="high-promo-val">0%</h2>
            </div>
        </section>

        <section class="games-container">
            <div class="games-controls">
                <button id="refresh-btn">🔄 Refresh offers</button>
            </div>

            <div class="games-grid">
                <p class="loading">Baiting Sharks...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
