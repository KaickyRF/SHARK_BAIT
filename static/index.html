<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharkBait - Game Deals Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🦈 SharkBait</h1>
        <p>The best deals for your money</p>
    </header>

    <main class="dashboard-grid">
        <section class="kpis-container">
            <div class="kpis-card">
                <span class="kpis-total">Total Deals</span>
                <h2 id="total-deals-val">60</h2>
            </div>
            <div class="kpis-card">
                <span class="kpis-promo">Best Discount</span>
                <h2 id="high-promo-val">0.00</h2>
            </div>
            
        </section>

        <section class="games-container">
            <div class="games-controls">
                <button id="refresh-btn">🔄 Refresh offers</button>
            </div>


            <div class="games-grid">
                <p class="loading">Baiting Sharks...</p>
                <div class="games-card">
                    <img src="insira-imagem.jpg" alt="descreva a imagem" class="game-cover">

                    <div class="games-info">
                        <h3 class="games-title">SHARKBAIT</h3>
                        <span class="games-store">Steam</span>
                        <span class="games-steam-string">Overwhelmingly Positive</span> 
                        <span class="games-steam-rate">91.00</span> 
                        <span class="games-metacritic">91.00</span>
                        
                    </div>

                    <div class="games-offer">
                        <div class="games-offer-price">
                            <span class="games-discount">-60%</span>
                            <span class="games-price-now">5.99</span>
                            <span class="games-price-normal">15.99</span>
                        </div>
                        <div class="games-offer-metrics">
                            <span class="games-critic-steam">91</span>
                            <span class="games-rate-price">90.40</span>
                        </div>
                    </div>

                    <a href="#" class="buy-btn">Get Deal</a>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
